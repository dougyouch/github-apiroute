# Which REST operations get a paginated <name>_all method, and how they page. GitHub pages
# every list with a Link header (rel="next"); the rules differ only in where the items are.
# Rules are tried in order, and generate.py prints how many operations each matched.
- name: arrays
  response: array
  has_parameter: [page]
  paginate: {type: next_url}
- name: items
  has_parameter: [page]
  response: {has: [total_count, items]}
  paginate: {type: next_url, items: items}
