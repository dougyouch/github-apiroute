# A repository by owner and name.
query Repository($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    ...RepositoryFields
    defaultBranchRef {
      name
    }
    licenseInfo {
      spdxId
    }
    repositoryTopics(first: 20) {
      nodes {
        topic {
          name
        }
      }
    }
  }
}

# A repository's issues, every page (open ones unless states says otherwise).
query Issues($owner: String!, $name: String!, $states: [IssueState!] = [OPEN], $after: String) {
  repository(owner: $owner, name: $name) {
    issues(first: 100, after: $after, states: $states, orderBy: {field: CREATED_AT, direction: DESC}) @paginate {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ...IssueFields
      }
    }
  }
}

# One issue with its body.
query Issue($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      ...IssueFields
      body
    }
  }
}

# A repository's pull requests, every page (open ones unless states says otherwise).
query PullRequests($owner: String!, $name: String!, $states: [PullRequestState!] = [OPEN], $after: String) {
  repository(owner: $owner, name: $name) {
    pullRequests(first: 100, after: $after, states: $states, orderBy: {field: CREATED_AT, direction: DESC}) @paginate {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ...PullRequestFields
      }
    }
  }
}

# A repository's releases, newest first, every page.
query Releases($owner: String!, $name: String!, $after: String) {
  repository(owner: $owner, name: $name) {
    releases(first: 50, after: $after, orderBy: {field: CREATED_AT, direction: DESC}) @paginate {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        name
        tagName
        url
        isDraft
        isPrerelease
        publishedAt
      }
    }
  }
}

# Who starred a repository and when, every page.
query Stargazers($owner: String!, $name: String!, $after: String) {
  repository(owner: $owner, name: $name) {
    stargazers(first: 100, after: $after) @paginate {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        starredAt
        node {
          login
        }
      }
    }
  }
}
