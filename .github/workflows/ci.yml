name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # run by release.yml before publishing, and on the release PR before merging it
    inputs:
      ref:
        description: "The branch, tag or commit to test (default: the triggering commit)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # The committed code must be exactly what the committed specs generate: nothing in src/
  # is edited by hand, and specs/ and src/ never drift apart.
  generated-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run python scripts/generate.py
      - name: Check for differences
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated code differs from the committed specs. Run 'uv run python scripts/generate.py' and commit the result."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest
