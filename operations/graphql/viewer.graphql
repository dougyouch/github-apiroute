# The user the token belongs to. (No email: reading it needs the user:email or read:user scope.)
query Viewer {
  viewer {
    id
    login
    name
    bio
    company
    location
    url
    avatarUrl
    createdAt
  }
}

# The API rate limit left for the token.
query RateLimit {
  rateLimit {
    limit
    cost
    remaining
    resetAt
  }
}
