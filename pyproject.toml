[project]
name = "github-apiroute"
version = "0.3.0"
description = "Python clients for GitHub's REST and GraphQL APIs, generated with apiroute from GitHub's published API description and schema."
readme = "README.md"
license = "MIT"
authors = [{ name = "Doug Youch", email = "dougyouch@gmail.com" }]
requires-python = ">=3.10"
keywords = ["github", "api", "client", "rest", "graphql", "httpx", "async", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = ["apiroute>=2.3.0", "pydantic>=2.6"]

[project.urls]
Homepage = "https://github.com/dougyouch/github-apiroute"
Repository = "https://github.com/dougyouch/github-apiroute"
Issues = "https://github.com/dougyouch/github-apiroute/issues"
Changelog = "https://github.com/dougyouch/github-apiroute/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["apiroute[codegen]>=2.2.2", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_apiroute"]

[tool.hatch.build.targets.sdist]
exclude = ["specs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
